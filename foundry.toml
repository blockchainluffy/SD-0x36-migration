[profile.default]
src = "src"
out = "out"
libs = ["lib"]
script = "script"
test = "test"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
verbosity = 2

# The simulation writes its results (addresses + calldata) to ./sim
fs_permissions = [{ access = "read-write", path = "./sim" }]

[lint]
# Struct/field names mirror snapshot-labs/sx-evm verbatim, and the contract
# handles read as instance names on purpose. Casts on ABI-decoded data are checked.
exclude_lints = ["mixed-case-variable", "screaming-snake-case-const", "unsafe-typecast"]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
